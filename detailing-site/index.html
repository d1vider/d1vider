<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline Interiors Booking</title>
  <meta name="description" content="Detallado interior a domicilio para autos y muebles en el Área Metropolitana de Puerto Rico. Precios y citas en línea.">
  <meta property="og:title" content="Redline Interiors">
  <meta property="og:description" content="Detallado interior a domicilio · Área Metropolitana, PR. Mira precios y separa tu cita.">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <nav class="nav wrap">
      <a class="brand" href="#top" aria-label="Redline Interiors"><span class="brand-red">REDLINE</span> INTERIORS</a>
      <div class="nav-right">
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="es">ES</button><button data-lang="en">EN</button>
        </div>
        <a class="nav-cta" href="#book" data-t="bookNow"></a>
      </div>
    </nav>
    <div class="wrap hero-body" id="top">
      <p class="eyebrow" data-c="area"></p>
      <h1 data-c="tagline"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#prices" data-t="seePrices"></a>
        <a class="btn btn-ghost" href="#book" data-t="pickTime"></a>
      </div>
      <ul class="hero-facts" id="hero-facts"></ul>
    </div>
    <div class="tach" aria-hidden="true"><span></span></div>
  </header>

  <main>
    <section id="prices" class="wrap section">
      <div class="section-head">
        <p class="kicker" data-t="kPrices"></p>
        <h2 data-t="pricesTitle"></h2>
        <p data-t="pricesSub"></p>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="service-list" class="service-grid"></div>
      <div class="addons-block">
        <h3 data-t="addOns"></h3>
        <div id="addon-list" class="addon-grid"></div>
      </div>
    </section>

    <section id="about" class="section about-section">
      <div class="wrap about-layout">
        <div class="about-photo" aria-hidden="true"><span>R</span></div>
        <div>
          <p class="kicker" data-t="kAbout"></p>
          <h2 data-t="aboutTitle"></h2>
          <div id="about-text" class="about-text"></div>
          <ul class="about-points" id="about-points"></ul>
        </div>
      </div>
      <div class="wrap">
        <div id="gallery" class="gallery"></div>
      </div>
    </section>

    <section id="book" class="section book-section">
      <div class="wrap">
        <div class="section-head">
          <p class="kicker" data-t="kBook"></p>
          <h2 data-t="bookTitle"></h2>
          <p data-t="bookSub"></p>
        </div>

        <div class="book-layout">
          <div class="book-main">
            <div class="card step">
              <div class="step-title"><span class="step-num">1</span> <span data-t="step1"></span></div>
              <div class="cal-head">
                <button class="icon-btn" id="cal-prev" aria-label="‹">‹</button>
                <strong id="cal-label"></strong>
                <button class="icon-btn" id="cal-next" aria-label="›">›</button>
              </div>
              <div class="cal-grid cal-dow" id="cal-dow" aria-hidden="true"></div>
              <div class="cal-grid" id="cal-days"></div>
              <div class="cal-legend">
                <span><i class="dot dot-open"></i><span data-t="legendOpen"></span></span>
                <span><i class="dot dot-full"></i><span data-t="legendFull"></span></span>
                <span class="live" id="cal-status"></span>
              </div>
            </div>

            <div class="card step">
              <div class="step-title"><span class="step-num">2</span> <span data-t="step2"></span></div>
              <p class="muted" id="slot-hint"></p>
              <div class="slots" id="slots"></div>
            </div>

            <div class="card step">
              <div class="step-title"><span class="step-num">3</span> <span data-t="step3"></span></div>
              <form id="details" class="form" novalidate>
                <label><span data-t="fName"></span><input name="name" autocomplete="name" required maxlength="80"></label>
                <label><span data-t="fPhone"></span><input name="phone" type="tel" autocomplete="tel" required maxlength="30"></label>
                <label class="full"><span data-t="fAddress"></span><input name="address" autocomplete="street-address" required maxlength="160"></label>
                <label><span data-t="fTown"></span><select name="town" id="town" required></select></label>
                <label class="full"><span data-t="fNotes"></span><textarea name="notes" rows="3" maxlength="600"></textarea></label>
                <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
              </form>
            </div>
          </div>

          <aside class="book-side">
            <div class="card summary" id="summary">
              <h3 data-t="yourBooking"></h3>
              <ul class="cart" id="cart"></ul>
              <div id="cart-empty" class="muted"><span data-t="cartEmpty"></span> <a href="#prices" data-t="browse"></a></div>
              <dl class="totals">
                <div><dt data-t="estTime"></dt><dd id="sum-time">—</dd></div>
                <div><dt data-t="when"></dt><dd id="sum-when">—</dd></div>
                <div class="grand"><dt data-t="estTotal"></dt><dd id="sum-total">—</dd></div>
                <div class="dep"><dt data-t="depositNow"></dt><dd id="sum-deposit">—</dd></div>
                <div><dt data-t="balance"></dt><dd id="sum-balance">—</dd></div>
              </dl>
              <p class="error" id="form-error" role="alert"></p>
              <div id="send-actions">
                <button class="btn btn-primary block" id="send" data-t="send"></button>
                <button class="btn btn-ghost block" id="send-email" data-t="sendEmail"></button>
                <p class="fine"></p>
                <div class="paychips" id="paychips"></div>
              </div>
              <div id="done" class="done" hidden></div>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <section class="wrap section">
      <div class="section-head"><p class="kicker" data-t="kInfo"></p><h2 data-t="goodToKnow"></h2></div>
      <ul class="notes" id="notes"></ul>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span class="brand"><span class="brand-red">REDLINE</span> INTERIORS</span>
      <span><span data-c="area"></span> · <a id="foot-phone"></a><span id="foot-email-wrap"> · <a id="foot-email"></a></span></span>
    </div>
  </footer>

  <div class="sticky-bar" id="sticky-bar">
    <span id="sticky-text"></span>
    <a class="btn btn-primary" href="#book" data-t="continue"></a>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
