# XcodeGen specification.
#
# ProtocolAcademy.xcodeproj is committed and should open directly in Xcode 16 or later.
# This file is the fallback: if the project file is ever damaged by a merge, run
#   brew install xcodegen && xcodegen generate
# from this directory to rebuild an equivalent project.

name: ProtocolAcademy
options:
  bundleIdPrefix: com.d1vider
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE

targets:
  ProtocolAcademy:
    type: application
    platform: iOS
    sources:
      - path: ProtocolAcademy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.d1vider.protocolacademy
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - ProtocolAcademyTests
      gatherCoverageData: true
      storeKitConfiguration: Products.storekit

  ProtocolAcademyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProtocolAcademyTests
    dependencies:
      - target: ProtocolAcademy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.d1vider.protocolacademy.tests
